services:
  postgres:
    image: postgres:16-alpine
    container_name: studyb-postgres
    restart: unless-stopped
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: studyb
      POSTGRES_PASSWORD: studyb_secret
      POSTGRES_DB: studyb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
