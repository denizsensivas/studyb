services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: studyb-app
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/studyb?schema=public
      - JWT_SECRET=change-this-in-production
      - PORT=8080
      - NODE_ENV=production
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16-alpine
    container_name: studyb-db
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=studyb
    ports:
      - "5433:5432" # Host port 5433 to avoid conflict with local postgres
    volumes:
      - studyb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  studyb-data:
